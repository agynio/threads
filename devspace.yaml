version: v2beta1

vars:
  THREADS_NAMESPACE: platform
  E2E_IMAGE: ghcr.io/agynio/devcontainer-go:1

functions:
  threads_deployment: |-
    # The release name varies by install: the umbrella chart names it
    # threads-threads, a standalone install just threads. Resolve it by label
    # rather than guessing.
    kubectl get deployment -n ${THREADS_NAMESPACE} \
      -l app.kubernetes.io/name=threads \
      -o jsonpath='{.items[0].metadata.name}'
  patch_deployment: |-
    echo "Patching threads deployment for DevSpace..."
    kubectl patch deployment "$(threads_deployment)" -n ${THREADS_NAMESPACE} --type strategic --patch "$(cat <<'EOF'
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            fsGroup: 1000
          initContainers: []
          volumes:
            - name: data
              emptyDir: {}
          containers:
            - name: threads
              image: ghcr.io/agynio/devcontainer-go:1 # keep in sync with E2E_IMAGE
              workingDir: /opt/app/data
              # All three go. The container generates and compiles before it
              # listens, so liveness would restart it mid-build -- and devspace
              # will not start syncing until the pod is ready, so a readiness
              # probe on the port deadlocks: no source, so no listener, so never
              # ready, so no sync. The dev pipeline waits on port 50051 itself
              # once the sync is through.
              livenessProbe: null
              startupProbe: null
              readinessProbe: null
              command:
                - sh
                - -c
                - |
                  set -eu
                  # devspace only starts syncing once the pod is up, and waits
                  # for it to be ready first -- so exiting here restarts the
                  # container and the sync never lands. Wait for the whole set
                  # generation needs, not just go.mod, or buf runs on a half
                  # synced tree.
                  elapsed=0
                  until [ -f /opt/app/data/go.mod ] \
                    && [ -f /opt/app/data/go.sum ] \
                    && [ -f /opt/app/data/buf.gen.yaml ] \
                    && [ -f /opt/app/data/buf.yaml ]; do
                    sleep 1; elapsed=$((elapsed + 1))
                    if [ "$elapsed" -ge 600 ]; then
                      echo "ERROR: sync timeout waiting for source files" >&2
                      ls -la /opt/app/data >&2 || true
                      exit 1
                    fi
                  done
                  buf generate buf.build/agynio/api --path agynio/api/threads/v1 --path agynio/api/notifications/v1 --path agynio/api/identity/v1 --path agynio/api/metering/v1 --path agynio/api/authorization/v1 --path agynio/api/agents/v1
                  exec go run ./cmd/threads
              volumeMounts:
                - name: data
                  mountPath: /opt/app/data
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
    EOF
    )"

deployments:
  e2e-runner:
    namespace: ${THREADS_NAMESPACE}
    helm:
      chart:
        name: component-chart
        repo: https://charts.devspace.sh
      values:
        containers:
          - image: ${E2E_IMAGE}
            env:
              - name: THREADS_ADDRESS
                value: "threads:50051"
        labels:
          app.kubernetes.io/name: threads-e2e

commands:
  test-e2e: |-
    devspace run-pipeline test-e2e $@

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      patch_deployment
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace threads
      else
        start_dev --disable-pod-replace threads
        echo "Waiting for threads to be healthy on :50051..."
        healthy=false
        for i in $(seq 1 60); do
          if exec_container --label-selector=app.kubernetes.io/name=threads -n ${THREADS_NAMESPACE} -- bash -c 'nc -z localhost 50051 >/dev/null 2>&1 || (echo > /dev/tcp/localhost/50051) >/dev/null 2>&1'; then
            healthy=true
            break
          fi
          sleep 2
        done
        if [ "$healthy" != "true" ]; then
          echo "ERROR: Threads did not become healthy within 120s" >&2
          exit 1
        fi
        echo "Dev environment ready. Stopping dev session."
        stop_dev threads
      fi

  test-e2e:
    run: |-
      create_deployments e2e-runner
      start_dev e2e-runner &
      sleep 5
      exec_container \
        --label-selector "app.kubernetes.io/name=threads-e2e" \
        -n ${THREADS_NAMESPACE} \
        -- bash -c 'cd /opt/app/data && buf generate buf.build/agynio/api --path agynio/api/threads/v1 --path agynio/api/notifications/v1 --path agynio/api/identity/v1 --path agynio/api/metering/v1 --path agynio/api/authorization/v1 --path agynio/api/agents/v1 && go test -v -count=1 -tags e2e ./test/e2e/'
      EXIT_CODE=$?
      stop_dev e2e-runner
      purge_deployments e2e-runner
      exit $EXIT_CODE

hooks:

dev:
  threads:
    namespace: ${THREADS_NAMESPACE}
    # Name only: the instance label is the Helm release, which is threads for a
    # standalone install and agyn-platform under the umbrella chart.
    labelSelector:
      app.kubernetes.io/name: threads
    containers:
      threads:
        container: threads
        sync:
          - path: ./:/opt/app/data
            excludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
            uploadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
            downloadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
        logs:
          enabled: true
          lastLines: 200
    ports:
      - port: "50051"

  e2e-runner:
    namespace: ${THREADS_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: threads-e2e
    command: ["sleep", "infinity"]
    workingDir: /opt/app/data
    sync:
      - path: ./:/opt/app/data
        excludePaths:
          - .git/
          - .devspace/
          - /.gen/
          - /tmp/
