apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "threads.fullname" . }}
  labels:
    {{- include "threads.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "threads.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "threads.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "threads.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: threads
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            successThreshold: {{ .Values.probes.liveness.successThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- $db := .Values.database -}}
            {{- $url := "" -}}
            {{- $secretName := "" -}}
            {{- $secretKey := "database-url" -}}
            {{- if $db }}
              {{- with $db.url }}
                {{- $url = . -}}
              {{- end }}
              {{- with $db.existingSecret }}
                {{- with .name }}
                  {{- $secretName = . -}}
                {{- end }}
                {{- with .key }}
                  {{- $secretKey = . -}}
                {{- end }}
              {{- end }}
            {{- end }}
            {{- if and $secretName $url }}
              {{- fail "set only one of database.url or database.existingSecret.name" -}}
            {{- end }}
            - name: DATABASE_URL
              {{- if $secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $secretKey }}
              {{- else }}
              value: {{ required "database.url or database.existingSecret.name must be set" $url | quote }}
              {{- end }}
            - name: NOTIFICATIONS_ADDRESS
              value: {{ required "notifications.address must be set" .Values.notifications.address | quote }}
            - name: IDENTITY_ADDRESS
              value: {{ .Values.identity.address | quote }}
            - name: AUTHORIZATION_ADDRESS
              value: {{ .Values.authorization.address | quote }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
